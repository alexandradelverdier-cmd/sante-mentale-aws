version: 2

seeds:
  - name: ref_regions
    description: "Régions Open Medic (descriptif officiel 2024). 5 = DROM regroupés, 93 = PACA + Corse, 0 et 99 = inconnu."
    config:
      column_types: {region_code: varchar, est_region_connue: boolean}
    columns:
      - name: region_code
        tests: [unique, not_null]
  - name: ref_regions_insee
    description: "Passage des régions Open Medic vers les codes INSEE. inclus_denominateur = false pour Mayotte : couverture par Open Medic non confirmée (régime CSSM distinct). Hypothèse à basculer ici si besoin."
    config:
      column_types: {region_code: varchar, region_insee_code: varchar, inclus_denominateur: boolean}
  - name: ref_tranches_age
    config:
      column_types: {tranche_age_code: varchar}
  - name: ref_sexe
    config:
      column_types: {sexe_code: varchar}
  - name: ref_prescripteurs
    description: "Spécialité du prescripteur. Attention : les psychiatres hospitaliers sont dans le code 90 (salariés), pas dans le 17."
    config:
      column_types: {prescripteur_specialite_code: varchar}
    columns:
      - name: prescripteur_specialite_code
        tests: [unique, not_null]
  - name: ref_classes_psychotropes
    description: "Classes ATC3 retenues comme psychotropes pour le projet."
    columns:
      - name: atc3_code
        tests: [unique, not_null]
  - name: ref_atc5_complements
    description: "Libellés des codes ATC5 présents uniquement en 2014-2015, absents du référentiel construit sur 2016+."
    columns:
      - name: atc5_code
        tests: [unique, not_null]
  - name: ref_classes_age_insee
    description: "Regroupement des grandes classes d'âge INSEE dans les tranches Open Medic."
    config:
      column_types: {tranche_age_code: varchar}
