version: 2

models:
  - name: mart_psychotropes__region_annee
    description: >
      Consommants de psychotropes par région, classe (antidépresseurs, anxiolytiques, hypnotiques,
      antipsychotiques, psychostimulants) et année, 2014-2025. Table Parquet.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [annee, region_code, classe_courte]
    columns:
      - name: nb_consommants
        tests: [not_null]

  - name: mart_psychotropes__taux_region_annee
    description: >
      Taux de consommants de psychotropes pour 1 000 habitants, par région, classe et année, 2014-2025.
      Taux brut (population moyenne de l'année) et taux standardisé sur l'âge et le sexe
      (référence : France entière 2025). Régions connues uniquement.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [annee, region_code, classe_courte]
    columns:
      - name: taux_brut_pour_1000
        tests: [not_null]
      - name: taux_standardise_pour_1000
        tests: [not_null]

  - name: mart_sante_mentale__region_annee
    description: >
      Mart central du projet : offre de soins en santé mentale (psychiatres, psychologues pour 100 000 hab.)
      et consommation de psychotropes (taux standardisés pour 1 000 hab.), par région et année, 2014-2025.
      Psychologues disponibles jusqu'en 2024 seulement.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [annee, region_code]
    columns:
      - name: densite_psychiatres
        tests: [not_null]
      - name: taux_std_antidepresseurs
        tests: [not_null]

  - name: mart_offre__departement_annee
    description: >
      Offre de soins en santé mentale par département : psychiatres (total, libéraux et mixtes, hospitaliers)
      et psychologues, effectifs et densités pour 100 000 habitants, 2012-2026. Mayotte incluse.
      Quartiles calculés par année (1 = les moins dotés).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [annee, departement_code]
    columns:
      - name: population
        description: "Vide si le code département DREES ne se raccorde pas à l'INSEE"
        tests: [not_null]
      - name: departement_libelle
        tests: [not_null]
