version: 2

models:
  - name: stg_insee__population
    description: "Population au 1er janvier, grain : région INSEE x sexe x classe d'âge INSEE x année."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [annee, region_insee_code, sexe_code, classe_age_insee]
    columns:
      - name: population
        tests: [not_null]
  - name: stg_insee__population_departement
    description: "Population au 1er janvier, grain : département x sexe x classe d'âge INSEE x année."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [annee, departement_code, sexe_code, classe_age_insee]
