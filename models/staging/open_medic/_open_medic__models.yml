version: 2

models:
  - name: stg_open_medic__consommants
    description: >
      Nombre de consommants par molécule (ATC5), tranche d'âge, sexe, région et année, 2014-2025.
      Les cases de moins de 11 personnes sont masquées par le secret statistique et regroupées en région 99.
    columns:
      - name: annee
        tests: [not_null]
      - name: atc5_code
        tests: [not_null]
      - name: tranche_age_code
        tests:
          - accepted_values:
              arguments:
                values: ['0', '20', '60', '99']
      - name: sexe_code
        tests:
          - accepted_values:
              arguments:
                values: ['1', '2', '9']
      - name: nb_consommants
        tests: [not_null]
